name: Static checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python analysis tools
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check backend --output-format=github
      - name: Ruff formatting
        run: python -m ruff format --check backend
      - name: Prettier
        run: npx --yes prettier@3.6.2 --check .
      - name: Whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
